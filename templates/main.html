{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Dashboard{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

{% block css %}{% endblock %}

<style>
/* ════════════════════════════════════════
   TOKENS
   ════════════════════════════════════════ */
:root {
  --sb-w:         248px;
  --sb-mini:       64px;
  --sb-bg:        #0d0d0d;
  --sb-border:    rgba(255,255,255,0.07);
  --sb-text:      rgba(255,255,255,0.52);
  --sb-hover-bg:  rgba(255,255,255,0.07);
  --sb-active-bg: rgba(255,255,255,0.11);
  --accent:       #6c63ff;
  --accent-soft:  rgba(108,99,255,0.12);
  --green:        #10b981;
  --orange:       #f59e0b;
  --red:          #ef4444;
  --page-bg:      #f1f3f9;
  --card-bg:      #ffffff;
  --text:         #0f172a;
  --muted:        #64748b;
  --border:       #e4e8f0;
  --radius:       14px;
  --radius-lg:    18px;
  --ease:         0.22s cubic-bezier(0.4,0,0.2,1);
}

/* ════════════════════════════════════════
   BASE
   ════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--page-bg);
  color: var(--text);
  margin: 0;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════ */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  height: 100vh;
  width: var(--sb-w);
  background: var(--sb-bg);
  display: flex;
  flex-direction: column;
  z-index: 200;
  overflow: hidden;
  transition: width var(--ease);
  border-right: 1px solid var(--sb-border);
}

.sidebar::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent);
  opacity: 0.6;
}

.sidebar.collapsed { width: var(--sb-mini); }

/* ── Logo ── */
.sidebar-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  height: 68px;
  border-bottom: 1px solid var(--sb-border);
  text-decoration: none !important;
  flex-shrink: 0;
  overflow: hidden;
}
.logo-full {
  height: 40px;
  width: auto;
  object-fit: contain;
  transition: opacity var(--ease), width var(--ease);
  max-width: 160px;
  filter: brightness(0) invert(1);   /* ← add this */
}

.logo-mini {
  height: 32px;
  width: 32px;
  object-fit: contain;
  position: absolute;
  opacity: 0;
  transition: opacity var(--ease);
  border-radius: 8px;
  filter: brightness(0) invert(1);   /* ← add this */
}

.sidebar.collapsed .logo-full { opacity: 0; width: 0; }
.sidebar.collapsed .logo-mini { opacity: 1; position: relative; }

/* ── Toggle ── */
.sidebar-toggle {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 6px 12px;
  cursor: pointer;
  flex-shrink: 0;
  border-bottom: 1px solid var(--sb-border);
}

.sidebar-toggle i {
  color: rgba(255,255,255,0.3);
  font-size: 17px;
  transition: transform var(--ease), color var(--ease);
  padding: 4px;
  border-radius: 6px;
}

.sidebar-toggle:hover i { color: rgba(255,255,255,0.7); background: var(--sb-hover-bg); }
.sidebar.collapsed .sidebar-toggle i { transform: rotate(180deg); }

/* ── Nav ── */
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px 10px;
  scrollbar-width: none;
}
.sidebar-nav::-webkit-scrollbar { display: none; }

.nav-section-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  padding: 16px 10px 5px;
  white-space: nowrap;
  transition: opacity var(--ease);
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.06);
}

.sidebar.collapsed .nav-section-label { opacity: 0; padding-top: 6px; }
.sidebar.collapsed .nav-section-label::after { display: none; }

/* flat item */
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8.5px 10px;
  border-radius: 9px;
  color: var(--sb-text);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 450;
  margin-bottom: 1px;
  transition: background var(--ease), color var(--ease);
  white-space: nowrap;
  position: relative;
}

.nav-item i { font-size: 18px; flex-shrink: 0; }
.nav-item:hover { background: var(--sb-hover-bg); color: #fff; }
.nav-item.active { background: var(--sb-active-bg); color: #fff; }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px; border-radius: 3px;
  background: var(--accent);
}

.nav-item-label { transition: opacity var(--ease); flex: 1; }
.sidebar.collapsed .nav-item-label { opacity: 0; width: 0; overflow: hidden; }

/* badge */
.nav-badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 20px;
  background: var(--accent); color: #fff;
  margin-left: auto; line-height: 1.4;
  transition: opacity var(--ease);
}
.sidebar.collapsed .nav-badge { opacity: 0; }

/* group */
.nav-group { margin-bottom: 1px; }

.nav-group-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8.5px 10px;
  border-radius: 9px;
  color: var(--sb-text);
  font-size: 13.5px;
  font-weight: 450;
  cursor: pointer;
  transition: background var(--ease), color var(--ease);
  white-space: nowrap;
  user-select: none;
}

.nav-group-toggle:hover { background: var(--sb-hover-bg); color: #fff; }
.nav-group.open > .nav-group-toggle { color: rgba(255,255,255,0.88); }

.group-icon { font-size: 18px; flex-shrink: 0; }
.nav-group-label { flex: 1; transition: opacity var(--ease); }
.sidebar.collapsed .nav-group-label { opacity: 0; width: 0; overflow: hidden; }

.nav-group-arrow {
  font-size: 13px;
  color: rgba(255,255,255,0.22);
  transition: transform 0.25s ease, opacity var(--ease);
}
.sidebar.collapsed .nav-group-arrow { opacity: 0; }
.nav-group.open > .nav-group-toggle .nav-group-arrow { transform: rotate(90deg); color: rgba(255,255,255,0.5); }

/* children */
.nav-group-children {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  margin-left: 10px;
  padding-left: 18px;
  border-left: 1px solid rgba(255,255,255,0.07);
}
.nav-group.open .nav-group-children { max-height: 700px; }
.sidebar.collapsed .nav-group-children { max-height: 0; }

.nav-child {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6.5px 10px;
  border-radius: 8px;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  font-size: 13px;
  margin-bottom: 1px;
  transition: background var(--ease), color var(--ease);
  white-space: nowrap;
}
.nav-child i { font-size: 15px; flex-shrink: 0; }
.nav-child:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
.nav-child.active { color: #a5b4fc; }

/* Tooltips */
.sidebar.collapsed .nav-item[data-tip]:hover::after,
.sidebar.collapsed .nav-group-toggle[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  left: calc(var(--sb-mini) + 4px);
  top: 50%;
  transform: translateY(-50%);
  background: #1a1a2e;
  color: rgba(255,255,255,0.9);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 8px;
  white-space: nowrap;
  pointer-events: none;
  border: 1px solid rgba(255,255,255,0.1);
  z-index: 300;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

/* ── Bottom ── */
.sidebar-bottom {
  padding: 10px 8px;
  border-top: 1px solid var(--sb-border);
  flex-shrink: 0;
}

.logout-side {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8.5px 10px;
  border-radius: 9px;
  color: rgba(255,255,255,0.38);
  text-decoration: none;
  font-size: 13.5px;
  transition: background var(--ease), color var(--ease);
  white-space: nowrap;
}
.logout-side i { font-size: 18px; flex-shrink: 0; }
.logout-side:hover { background: rgba(239,68,68,0.1); color: #f87171; }
.logout-label { transition: opacity var(--ease); }
.sidebar.collapsed .logout-label { opacity: 0; width: 0; overflow: hidden; }

/* ════════════════════════════════════════
   MAIN
   ════════════════════════════════════════ */
.main {
  margin-left: var(--sb-w);
  padding: 28px 30px 40px;
  transition: margin-left var(--ease);
  min-height: 100vh;
}
.main.collapsed { margin-left: var(--sb-mini); }

/* ── Topbar ── */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  gap: 12px;
}

.topbar-left h4 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.4px;
  margin: 0 0 2px;
  color: var(--text);
}

.topbar-left p {
  font-size: .82rem;
  color: var(--muted);
  margin: 0;
}

.topbar-right { display: flex; align-items: center; gap: 10px; }

/* ── Stat cards ── */
.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px 18px;
  border: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  transition: transform var(--ease), box-shadow var(--ease), border-color var(--ease);
  display: block;
  text-decoration: none !important;
  color: inherit !important;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.stat-card::after {
  content: '';
  position: absolute;
  top: -50%; left: -60%;
  width: 50%; height: 200%;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
  transform: rotate(15deg);
  transition: left 0.55s ease;
  pointer-events: none;
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(108,99,255,0.12);
  border-color: rgba(108,99,255,0.2);
}

.stat-card:hover::after { left: 140%; }

.stat-stripe {
  position: absolute;
  left: 0; top: 22%; bottom: 22%;
  width: 3px; border-radius: 3px;
  background: var(--accent);
  opacity: 0;
  transition: opacity var(--ease), top var(--ease), bottom var(--ease);
}

.stat-card:hover .stat-stripe { opacity: 1; top: 12%; bottom: 12%; }

.stat-icon {
  width: 42px; height: 42px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem;
  margin-bottom: 14px;
  background: var(--accent-soft);
  color: var(--accent);
}

.stat-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}

.stat-value {
  font-size: 1.55rem;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
  line-height: 1;
}

/* variants */
.stat-card.is-danger  { border-color: rgba(239,68,68,.15); background: linear-gradient(135deg,#fff8f8,#fff); }
.stat-card.is-danger .stat-icon { background: rgba(239,68,68,.1); color: var(--red); }
.stat-card.is-danger .stat-title { color: #dc2626; }
.stat-card.is-danger .stat-value { color: #dc2626; }
.stat-card.is-danger .stat-stripe { background: var(--red); }
.stat-card.is-danger:hover { box-shadow: 0 12px 32px rgba(239,68,68,.1); border-color: rgba(239,68,68,.25); }

.stat-card.is-warning { border-color: rgba(245,158,11,.18); background: linear-gradient(135deg,#fffcf0,#fff); }
.stat-card.is-warning .stat-icon { background: rgba(245,158,11,.12); color: var(--orange); }
.stat-card.is-warning .stat-title { color: #b45309; }
.stat-card.is-warning .stat-value { color: #b45309; }
.stat-card.is-warning .stat-stripe { background: var(--orange); }
.stat-card.is-warning:hover { box-shadow: 0 12px 32px rgba(245,158,11,.1); border-color: rgba(245,158,11,.25); }

/* card entrance */
.stat-card { animation: cardPop .42s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes cardPop {
  from { opacity: 0; transform: scale(.93) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.stats-row > [class*="col-"]:nth-child(1) .stat-card { animation-delay:.04s; }
.stats-row > [class*="col-"]:nth-child(2) .stat-card { animation-delay:.09s; }
.stats-row > [class*="col-"]:nth-child(3) .stat-card { animation-delay:.14s; }
.stats-row > [class*="col-"]:nth-child(4) .stat-card { animation-delay:.19s; }
.stats-row > [class*="col-"]:nth-child(5) .stat-card { animation-delay:.24s; }
.stats-row > [class*="col-"]:nth-child(6) .stat-card { animation-delay:.29s; }
.stats-row > [class*="col-"]:nth-child(7) .stat-card { animation-delay:.34s; }
.stats-row > [class*="col-"]:nth-child(8) .stat-card { animation-delay:.39s; }

/* ── Orders table ── */
.orders-wrap {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: 0 2px 16px rgba(0,0,0,.05);
  overflow: hidden;
  animation: slideUp .44s ease both .1s;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

.orders-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
  background: linear-gradient(to bottom, #fafbff, #fff);
}

.orders-header-title {
  font-size: .95rem;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.orders-count-pill {
  font-size: .7rem;
  font-weight: 500;
  color: var(--muted);
  background: var(--page-bg);
  border: 1px solid var(--border);
  padding: 2px 9px;
  border-radius: 20px;
}

/* search */
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--page-bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  transition: border-color var(--ease), box-shadow var(--ease);
  max-width: 250px;
  flex: 1;
  min-width: 140px;
}

.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
}

.search-box i { color: var(--muted); font-size: 15px; flex-shrink: 0; }
.search-box input {
  border: none; background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: .83rem; color: var(--text);
  outline: none; width: 100%; min-width: 0;
}
.search-box input::placeholder { color: #aab; }

/* table */
.table-scroll-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.orders-table { width: 100%; border-collapse: collapse; min-width: 540px; }

.orders-table thead th {
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 11px 16px;
  background: #f8f9fc;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.orders-table td {
  padding: 13px 16px;
  font-size: .85rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

.orders-table tbody tr {
  cursor: pointer;
  transition: background var(--ease);
  animation: fadeRow .3s ease both;
}
@keyframes fadeRow {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}
.orders-table tbody tr:nth-child(1) { animation-delay:.05s; }
.orders-table tbody tr:nth-child(2) { animation-delay:.09s; }
.orders-table tbody tr:nth-child(3) { animation-delay:.13s; }
.orders-table tbody tr:nth-child(4) { animation-delay:.17s; }
.orders-table tbody tr:nth-child(5) { animation-delay:.21s; }
.orders-table tbody tr:last-child td { border-bottom: none; }
.orders-table tbody tr:hover { background: #f5f6ff; }

.order-id { font-size: .75rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.customer-name { font-weight: 600; color: var(--text); line-height: 1.3; }
.ref-pill {
  display: inline-block; margin-top: 3px;
  background: rgba(108,99,255,0.08); color: var(--accent);
  padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.amount { font-weight: 600; white-space: nowrap; }
.date-text { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.dash-cell { color: var(--border); }

/* status badges */
.sbadge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .68rem; font-weight: 600;
  padding: 3px 9px; border-radius: 20px;
  white-space: nowrap; letter-spacing: .01em;
}
.sbadge::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; }
.sb-success   { background:rgba(16,185,129,.1);  color:#059669; }
.sb-danger    { background:rgba(239,68,68,.1);   color:#dc2626; }
.sb-warning   { background:rgba(245,158,11,.15); color:#b45309; }
.sb-info      { background:rgba(108,99,255,.1);  color:#4338ca; }
.sb-secondary { background:rgba(100,116,139,.1); color:#475569; }
.sb-primary   { background:rgba(108,99,255,.1);  color:var(--accent); }

/* payment badges */
.pbadge { font-size:.68rem; font-weight:600; padding:3px 9px; border-radius:7px; white-space:nowrap; display:inline-block; line-height:1.5; }
.pb-dark  { background:#0f172a; color:#fff; }
.pb-blue  { background:var(--accent); color:#fff; }
.pb-green { background:#10b981; color:#fff; }
.pb-hidden { color:var(--muted); font-size:.8rem; }

/* edit btn */
.btn-edit {
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; border-radius:8px;
  background:rgba(245,158,11,.1); color:#b45309;
  border:none; font-size:.82rem;
  transition: background var(--ease), transform .2s cubic-bezier(.34,1.56,.64,1);
  text-decoration:none;
}
.btn-edit:hover { background:var(--orange); color:#fff; transform:scale(1.12) rotate(-4deg); }

.empty-row td { text-align:center; padding:56px 24px; color:var(--muted); font-size:.9rem; }
.empty-icon { font-size:2.4rem; display:block; margin-bottom:10px; opacity:.2; }

/* pagination */
.pagination-wrap {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; border-top:1px solid var(--border);
  flex-wrap:wrap; gap:8px; background:#fafbff;
}
.pagination-info { font-size:.77rem; color:var(--muted); }
.pagination-controls { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }

.page-btn {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:32px; height:32px; padding:0 7px;
  border-radius:8px; border:1px solid var(--border);
  background:var(--card-bg); color:var(--text);
  text-decoration:none !important;
  font-size:.77rem; font-weight:500;
  font-family:'Inter',sans-serif;
  transition: background var(--ease), border-color var(--ease), color var(--ease);
  cursor:pointer; line-height:1;
}
.page-btn:hover      { background:rgba(108,99,255,.08); border-color:rgba(108,99,255,.3); color:var(--accent); }
.page-btn.active     { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; cursor:default; }
.page-btn.disabled   { opacity:.35; pointer-events:none; }
.page-ellipsis       { display:inline-flex; align-items:center; justify-content:center; width:28px; height:32px; font-size:.82rem; color:var(--muted); }

/* ════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════ */
@media (max-width: 1024px) {
  .col-date { display: none; }
  .orders-table thead th, .orders-table td { padding: 11px 10px; }
}
@media (max-width: 640px) {
  .main { padding: 16px; }
  .col-payment, .col-edit { display: none; }
  .orders-table { min-width: 420px; }
  .pagination-wrap { justify-content: center; }
  .pagination-info { width: 100%; text-align: center; }
}
</style>
</head>
<body>

{% include "components/sidebar.html" %}

<div class="main" id="main">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const main = document.getElementById('main');
    sb.classList.toggle('collapsed');
    main.classList.toggle('collapsed');
    localStorage.setItem('sb_collapsed', sb.classList.contains('collapsed'));
  }

  function toggleGroup(id) {
    if (document.getElementById('sidebar').classList.contains('collapsed')) return;
    const el = document.getElementById(id);
    el.classList.toggle('open');
    localStorage.setItem('group_' + id, el.classList.contains('open'));
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (localStorage.getItem('sb_collapsed') === 'true') {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('main').classList.add('collapsed');
    }
    document.querySelectorAll('.nav-group[id]').forEach(function(g) {
      if (localStorage.getItem('group_' + g.id) === 'true') g.classList.add('open');
    });
  });
</script>

{% block js %}{% endblock %}
</body>
</html>
