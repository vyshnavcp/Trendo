{% extends 'main.html' %}
{% block title %}Add SubCategory{% endblock %}
{% load static %}

{% block css %}
<style>
.page-wrapper {
    min-height: calc(100vh - 120px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
}

.card {
    border: none;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 20px 60px rgba(0,0,0,.08);
    width: 100%;
    max-width: 450px;
    transition: .3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 25px 70px rgba(0,0,0,.12);
}

.form-label {
    font-weight: 500;
}

.form-control,
.form-select {
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid #e1e5ea;
    transition: .2s;
}

.form-control:focus,
.form-select:focus {
    border-color: #000;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.05);
}

.btn-black {
    background: linear-gradient(135deg, #000, #222);
    color: #fff;
    border-radius: 12px;
    padding: 13px;
    font-weight: 600;
    width: 100%;
    border: none;
    transition: .3s;
}

.btn-black:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    color: #fff;
}

.page-title {
    font-weight: 600;
    text-align: center;
    margin-bottom: 25px;
}
</style>
{% endblock %}

{% block content %}

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <h4>Sub Categories</h4>
    <p>Manage your product subcategories</p>
  </div>
  <div class="topbar-right">
    <a href="{% url 'subcategory_list' %}" class="btn-edit" style="width:auto;padding:0 14px;gap:6px;font-size:.82rem;font-weight:600;text-decoration:none;">
      <i class="bi bi-list-ul"></i> View All
    </a>
  </div>
</div>

<!-- FORM -->
<div class="page-wrapper">
  <div class="card p-4">

    <h4 class="page-title">Add SubCategory</h4>

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Select Category</label>
        <select name="category" class="form-select" required>
          <option value="">-- Choose Category --</option>
          {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label">SubCategory Name</label>
        <input type="text"
               name="name"
               class="form-control"
               placeholder="Enter subcategory name"
               required>
      </div>

      <button type="submit" class="btn-black">
        <i class="bi bi-check-circle me-1"></i> Save SubCategory
      </button>

    </form>

  </div>
</div>

{% endblock %}

{% block js %}{% endblock %}
