{% extends 'main.html' %}
{% block title %}Add Article{% endblock %}
{% load static %}

{% block css %}
<style>
  .form-wrap {
    max-width: 780px;
    margin: 0 auto;
  }

  .form-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 2px 16px rgba(0,0,0,.05);
    padding: 32px 36px;
    animation: slideUp .4s ease both;
  }

  .form-section-title {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .field-group {
    margin-bottom: 20px;
  }

  .field-label {
    display: block;
    font-size: .82rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 7px;
  }

  .field-input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: .85rem;
    color: var(--text);
    background: var(--page-bg);
    outline: none;
    transition: border-color var(--ease), box-shadow var(--ease);
  }

  .field-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,.1);
    background: #fff;
  }

  /* Upload box */
  .upload-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px 20px;
    background: var(--page-bg);
    cursor: pointer;
    transition: border-color var(--ease), background var(--ease);
    text-align: center;
  }

  .upload-box:hover {
    border-color: #000;
    background: rgba(0,0,0,.03);
  }

  .upload-box i {
    font-size: 1.8rem;
    color: var(--muted);
    transition: color var(--ease);
  }

  .upload-box:hover i { color: #000; }

  .upload-box p {
    margin: 0;
    font-size: .83rem;
    font-weight: 500;
    color: var(--text);
  }

  .upload-box small {
    font-size: .74rem;
    color: var(--muted);
  }

  .upload-filename {
    font-size: .78rem;
    color: var(--accent);
    font-weight: 600;
    margin-top: 6px;
    display: none;
  }

  .preview-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: var(--radius);
    margin-top: 10px;
    border: 1px solid var(--border);
    display: none;
  }

  /* CKEditor */
  .editor-wrap {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color var(--ease), box-shadow var(--ease);
  }

  .editor-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,.1);
  }

  .ck.ck-editor__top .ck-sticky-panel .ck-toolbar {
    border: none !important;
    border-bottom: 1px solid var(--border) !important;
    border-radius: 0 !important;
    background: var(--page-bg) !important;
  }

  .ck.ck-editor__main > .ck-editor__editable {
    border: none !important;
    border-radius: 0 !important;
    min-height: 320px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: .88rem !important;
    background: #fff !important;
    box-shadow: none !important;
  }

  .ck.ck-editor__main > .ck-editor__editable:focus {
    box-shadow: none !important;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .btn-submit {
    width: 100%;
    padding: 11px;
    border-radius: 11px;
    background: #000;
    color: #fff;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: .88rem;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: background var(--ease), transform .2s cubic-bezier(.34,1.56,.64,1);
    margin-top: 8px;
  }

  .btn-submit:hover {
    background: #222;
    transform: translateY(-2px);
  }

  .btn-submit:active { transform: scale(.98); }

  @media (max-width: 560px) {
    .form-card { padding: 22px 18px; }
  }
</style>
{% endblock %}

{% block content %}

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <h4>Add Article</h4>
    <p>Write and publish a new article</p>
  </div>
  <div class="topbar-right">
    <a href="{% url 'article_list' %}"
       style="display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:.82rem;font-weight:600;text-decoration:none;">
      <i class="bi bi-newspaper"></i> Articles List
    </a>
  </div>
</div>

<!-- FORM -->
<div class="form-wrap">
  <div class="form-card">

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Article Details -->
      <span class="form-section-title">Article Details</span>

      <div class="field-group">
        <label class="field-label" for="articleTitle">Title</label>
        <input type="text" id="articleTitle" name="title"
               class="field-input" placeholder="Enter article title" required>
      </div>

      <div class="field-group">
        <label class="field-label">Article Image</label>
        <label class="upload-box" for="articleImage">
          <i class="bi bi-image"></i>
          <p>Click to upload article image</p>
          <small>JPG, PNG or WEBP recommended</small>
          <input type="file" id="articleImage" name="image"
                 accept="image/*" hidden
                 onchange="handleImageUpload(event)" required>
        </label>
        <span class="upload-filename" id="fileName"></span>
        <img id="imagePreview" class="preview-img" alt="Article image preview">
      </div>

      <hr class="divider">

      <!-- Content -->
      <span class="form-section-title">Content</span>

      <div class="field-group">
        <div class="editor-wrap">
          <textarea name="content" id="editor"></textarea>
        </div>
      </div>

      <hr class="divider">

      <button type="submit" class="btn-submit">
        <i class="bi bi-send-check"></i> Publish Article
      </button>

    </form>

  </div>
</div>

{% endblock %}

{% block js %}
<script>
  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const nameEl = document.getElementById('fileName');
    nameEl.textContent = '✓ ' + file.name;
    nameEl.style.display = 'block';

    const reader = new FileReader();
    reader.onload = function () {
      const img = document.getElementById('imagePreview');
      img.src = reader.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
</script>

<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
<script>
  ClassicEditor
    .create(document.querySelector('#editor'), {
      toolbar: [
        'heading', '|',
        'bold', 'italic', 'underline', 'strikethrough', '|',
        'bulletedList', 'numberedList', 'blockQuote', '|',
        'link', 'insertTable', '|',
        'undo', 'redo'
      ]
    })
    .catch(error => console.error(error));
</script>
{% endblock %}
