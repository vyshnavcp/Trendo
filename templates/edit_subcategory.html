{% extends 'main.html' %}
{% block title %}Edit Subcategory{% endblock %}
{% load static %}

{% block css %}
<style>
.premium-card {
    background: #fff;
    border: none;
    border-radius: 22px;
    padding: 40px;
    box-shadow: 0 25px 60px rgba(0,0,0,.08);
    max-width: 520px;
    margin: 0 auto;
}

.section-title {
    font-weight: 600;
    margin-top: 25px;
    margin-bottom: 15px;
    padding-left: 12px;
    border-left: 4px solid #000;
    display: flex;
    align-items: center;
    gap: 8px;
}

.form-control,
.form-select {
    border-radius: 12px;
    padding: 12px;
    border: 1px solid #e2e2e2;
}

.form-control:focus,
.form-select:focus {
    border-color: #000;
    box-shadow: none;
}

.btn-black {
    background: linear-gradient(45deg, #000, #333);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px;
    width: 100%;
    font-weight: 600;
    transition: .3s;
}

.btn-black:hover {
    box-shadow: 0 10px 25px rgba(0,0,0,.25);
    color: #fff;
}

.form-label {
    font-weight: 500;
    font-size: 13px;
    color: #444;
    margin-bottom: 6px;
}
</style>
{% endblock %}

{% block content %}

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <h4>Edit Subcategory</h4>
    <p>Update subcategory details</p>
  </div>
  <div class="topbar-right">
    <a href="{% url 'subcategory_list' %}" class="btn-custom">
      <i class="bi bi-grid me-1"></i> All Subcategories
    </a>
  </div>
</div>

<!-- FORM CARD -->
<div class="premium-card mb-4">

  <h3 class="fw-bold mb-4">
    <i class="bi bi-pencil-square me-2"></i> Edit Subcategory
  </h3>

  <form method="POST">
    {% csrf_token %}

    <div class="section-title">
      <i class="bi bi-tags"></i> Subcategory Details
    </div>

    <div class="mb-3">
      <label class="form-label">Subcategory Name</label>
      <input type="text"
             name="name"
             class="form-control"
             value="{{ subcategory.name }}"
             placeholder="e.g. Silk Sarees"
             required>
    </div>

    <div class="mb-4">
      <label class="form-label">Select Category</label>
      <select name="category" class="form-select" required>
        {% for cat in categories %}
          <option value="{{ cat.id }}"
            {% if cat.id == subcategory.category.id %}selected{% endif %}>
            {{ cat.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn-black">
      <i class="bi bi-check-circle me-1"></i> Update Subcategory
    </button>

  </form>

</div>

{% endblock %}
