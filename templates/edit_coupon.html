{% extends 'main.html' %}
{% block title %}Edit Coupon{% endblock %}
{% load static %}

{% block css %}
<style>
.premium-card {
    background: #fff;
    border: none;
    border-radius: 22px;
    padding: 40px;
    box-shadow: 0 25px 60px rgba(0,0,0,.08);
    max-width: 520px;
    margin: 0 auto;
}

.section-title {
    font-weight: 600;
    margin-top: 25px;
    margin-bottom: 15px;
    padding-left: 12px;
    border-left: 4px solid #000;
    display: flex;
    align-items: center;
    gap: 8px;
}

.form-control,
.form-select {
    border-radius: 12px;
    padding: 12px;
    border: 1px solid #e2e2e2;
}

.form-control:focus,
.form-select:focus {
    border-color: #000;
    box-shadow: none;
}

.btn-black {
    background: linear-gradient(45deg, #000, #333);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px;
    width: 100%;
    font-weight: 600;
    transition: .3s;
}

.btn-black:hover {
    box-shadow: 0 10px 25px rgba(0,0,0,.25);
    color: #fff;
}

.form-label {
    font-weight: 500;
    font-size: 13px;
    color: #444;
    margin-bottom: 6px;
}
</style>
{% endblock %}

{% block content %}

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <h4>Edit Coupon</h4>
    <p>Update coupon details</p>
  </div>
  <div class="topbar-right">
    <a href="{% url 'coupon_list' %}" class="btn-custom">
      <i class="bi bi-ticket-perforated me-1"></i> All Coupons
    </a>
  </div>
</div>

<!-- FORM CARD -->
<div class="premium-card mb-4">

  <h3 class="fw-bold mb-4">
    <i class="bi bi-pencil-square me-2"></i> Edit Coupon
  </h3>

  <form method="POST">
    {% csrf_token %}

    <div class="section-title">
      <i class="ti ti-ticket"></i> Coupon Details
    </div>

    <div class="mb-3">
      <label class="form-label">Coupon Code</label>
      <input type="text"
             name="code"
             class="form-control"
             value="{{ coupon.code }}"
             placeholder="e.g. SAVE20"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Discount Amount (₹)</label>
      <input type="number"
             step="0.01"
             name="discount"
             class="form-control"
             value="{{ coupon.discount_amount }}"
             placeholder="e.g. 150"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Minimum Cart Value (₹)</label>
      <input type="number"
             step="0.01"
             name="min_cart"
             class="form-control"
             value="{{ coupon.min_cart_value }}"
             placeholder="e.g. 500"
             required>
    </div>

    <div class="mb-4">
      <label class="form-label">Expiry Date</label>
      <input type="date"
             name="expiry"
             class="form-control"
             value="{{ coupon.expiry_date|date:'Y-m-d' }}"
             required>
    </div>

    <button type="submit" class="btn-black">
      <i class="bi bi-check-circle me-1"></i> Update Coupon
    </button>

  </form>

</div>

{% endblock %}
