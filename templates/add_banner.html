{% extends 'main.html' %}
{% block title %}Add Banner{% endblock %}
{% load static %}

{% block css %}
<style>
  .form-wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  .form-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 2px 16px rgba(0,0,0,.05);
    padding: 32px 36px;
    animation: slideUp .4s ease both;
  }

  .form-section-title {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .field-group {
    margin-bottom: 20px;
  }

  .field-label {
    display: block;
    font-size: .82rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 7px;
  }

  .field-input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: .85rem;
    color: var(--text);
    background: var(--page-bg);
    outline: none;
    transition: border-color var(--ease), box-shadow var(--ease);
  }

  .field-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,.1);
    background: #fff;
  }

  .upload-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px 20px;
    background: var(--page-bg);
    cursor: pointer;
    transition: border-color var(--ease), background var(--ease);
    text-align: center;
  }

  .upload-box:hover {
    border-color: #000;
    background: rgba(0,0,0,0.03);
  }

  .upload-box i {
    font-size: 1.8rem;
    color: var(--muted);
    transition: color var(--ease);
  }

  .upload-box:hover i { color: #000; }

  .upload-box p {
    margin: 0;
    font-size: .83rem;
    font-weight: 500;
    color: var(--text);
  }

  .upload-box small {
    font-size: .74rem;
    color: var(--muted);
  }

  .preview-img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: var(--radius);
    margin-top: 10px;
    border: 1px solid var(--border);
    display: none;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .btn-submit {
    width: 100%;
    padding: 11px;
    border-radius: 11px;
    background: #000;
    color: #fff;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: .88rem;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: background var(--ease), transform .2s cubic-bezier(.34,1.56,.64,1);
    margin-top: 8px;
  }

  .btn-submit:hover {
    background: #222;
    transform: translateY(-2px);
  }

  .btn-submit:active { transform: scale(.98); }

  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 560px) {
    .upload-grid { grid-template-columns: 1fr; }
    .form-card { padding: 22px 18px; }
  }
</style>
{% endblock %}

{% block content %}

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <h4>Add Banner</h4>
    <p>Upload a new homepage banner image</p>
  </div>
  <div class="topbar-right">
    <a href="{% url 'banner_list' %}"
       style="display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:.82rem;font-weight:600;text-decoration:none;transition:border-color var(--ease);">
      <i class="bi bi-images"></i> Banner List
    </a>
  </div>
</div>

<!-- FORM -->
<div class="form-wrap">
  <div class="form-card">

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Title -->
      <div class="field-group">
        <span class="form-section-title">Banner Details</span>
        <label class="field-label" for="bannerTitle">Banner Title</label>
        <input type="text" id="bannerTitle" name="title"
               class="field-input" placeholder="e.g. Summer Sale 2025" required>
      </div>

      <hr class="divider">

      <!-- Images -->
      <span class="form-section-title">Images</span>

      <div class="upload-grid" style="margin-top:10px;">

        <!-- Desktop -->
        <div class="field-group" style="margin-bottom:0;">
          <label class="field-label">Desktop Image</label>
          <label class="upload-box" for="desktopImg">
            <i class="bi bi-display"></i>
            <p>Click to upload</p>
            <small>Recommended: 1920 × 800</small>
            <input type="file" id="desktopImg" name="image" accept="image/*"
                   hidden onchange="previewImage(event,'preview1')" required>
          </label>
          <img id="preview1" class="preview-img" alt="Desktop preview">
        </div>

        <!-- Mobile -->
        <div class="field-group" style="margin-bottom:0;">
          <label class="field-label">
            Mobile Image
            <span style="font-size:.7rem;font-weight:400;color:var(--muted);margin-left:4px;">optional</span>
          </label>
          <label class="upload-box" for="mobileImg">
            <i class="bi bi-phone"></i>
            <p>Click to upload</p>
            <small>Recommended: 768 × 600</small>
            <input type="file" id="mobileImg" name="mobile_image" accept="image/*"
                   hidden onchange="previewImage(event,'preview2')">
          </label>
          <img id="preview2" class="preview-img" alt="Mobile preview">
        </div>

      </div>

      <hr class="divider">

      <!-- Submit -->
      <button type="submit" class="btn-submit">
        <i class="bi bi-check-circle"></i> Save Banner
      </button>

    </form>

  </div>
</div>

{% endblock %}

{% block js %}
<script>
  function previewImage(event, id) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      const img = document.getElementById(id);
      img.src = reader.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
</script>
{% endblock %}
