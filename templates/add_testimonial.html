{% extends 'main.html' %}
{% block title %}Add Testimonial{% endblock %}
{% load static %}

{% block css %}
<style>
  .form-wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .form-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 2px 16px rgba(0,0,0,.05);
    padding: 32px 36px;
    animation: slideUp .4s ease both;
  }

  .form-section-title {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .field-group {
    margin-bottom: 20px;
  }

  .field-label {
    display: block;
    font-size: .82rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 7px;
  }

  /* CKEditor */
  .editor-wrap {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color var(--ease), box-shadow var(--ease);
  }

  .editor-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,.1);
  }

  .ck.ck-editor__top .ck-sticky-panel .ck-toolbar {
    border: none !important;
    border-bottom: 1px solid var(--border) !important;
    border-radius: 0 !important;
    background: var(--page-bg) !important;
  }

  .ck.ck-editor__main > .ck-editor__editable {
    border: none !important;
    border-radius: 0 !important;
    min-height: 160px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: .88rem !important;
    background: #fff !important;
    box-shadow: none !important;
  }

  .ck.ck-editor__main > .ck-editor__editable:focus {
    box-shadow: none !important;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .btn-submit {
    width: 100%;
    padding: 11px;
    border-radius: 11px;
    background: #000;
    color: #fff;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: .88rem;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: background var(--ease), transform .2s cubic-bezier(.34,1.56,.64,1);
    margin-top: 8px;
  }

  .btn-submit:hover {
    background: #222;
    transform: translateY(-2px);
  }

  .btn-submit:active { transform: scale(.98); }

  @media (max-width: 560px) {
    .form-card { padding: 22px 18px; }
  }
</style>
{% endblock %}

{% block content %}

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <h4>Add Testimonial</h4>
    <p>Add a new customer testimonial</p>
  </div>
  <div class="topbar-right">
    <a href="{% url 'testimonial_list' %}"
       style="display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:.82rem;font-weight:600;text-decoration:none;">
      <i class="bi bi-chat-left-text"></i> Testimonials List
    </a>
  </div>
</div>

<!-- FORM -->
<div class="form-wrap">
  <div class="form-card">

    <form method="POST">
      {% csrf_token %}

      <span class="form-section-title">Testimonial Details</span>

      <!-- Name -->
      <div class="field-group">
        <label class="field-label">Customer Name</label>
        <div class="editor-wrap">
          <textarea name="name" id="name_editor"></textarea>
        </div>
      </div>

      <hr class="divider">

      <!-- Review -->
      <div class="field-group">
        <label class="field-label">Review</label>
        <div class="editor-wrap">
          <textarea name="review" id="review_editor"></textarea>
        </div>
      </div>

      <hr class="divider">

      <button type="submit" class="btn-submit">
        <i class="bi bi-check-circle"></i> Save Testimonial
      </button>

    </form>

  </div>
</div>

{% endblock %}

{% block js %}
<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
<script>
  ClassicEditor
    .create(document.querySelector('#name_editor'), {
      toolbar: ['bold', 'italic', '|', 'undo', 'redo']
    })
    .catch(error => console.error(error));

  ClassicEditor
    .create(document.querySelector('#review_editor'), {
      toolbar: [
        'bold', 'italic', 'underline', '|',
        'bulletedList', 'numberedList', '|',
        'undo', 'redo'
      ]
    })
    .catch(error => console.error(error));
</script>
{% endblock %}
