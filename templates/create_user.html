{% extends 'main.html' %}
{% block title %}Create Employee{% endblock %}
{% load static %}

{% block css %}
<style>
.page-wrapper {
    min-height: calc(100vh - 120px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.premium-card {
    background: #fff;
    border: none;
    border-radius: 22px;
    padding: 40px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 25px 60px rgba(0,0,0,.08);
    transition: .3s;
}

.premium-card:hover {
    transform: translateY(-4px);
}

.page-title {
    font-weight: 700;
    text-align: center;
    margin-bottom: 25px;
}

.form-control,
.form-select {
    border-radius: 12px;
    padding: 12px;
    border: 1px solid #e2e2e2;
}

.form-control:focus,
.form-select:focus {
    border-color: #000;
    box-shadow: none;
}

.btn-save {
    background: linear-gradient(45deg, #000, #333);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 13px;
    font-weight: 600;
    width: 100%;
    transition: .3s;
}

.btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,.3);
    color: #fff;
}
</style>
{% endblock %}

{% block content %}

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <h4>Employees</h4>
    <p>Manage your team members</p>
  </div>
  <div class="topbar-right">
    <a href="{% url 'employee_list' %}" class="btn-edit" style="width:auto;padding:0 14px;gap:6px;font-size:.82rem;font-weight:600;text-decoration:none;">
      <i class="bi bi-list-ul"></i> View All
    </a>
  </div>
</div>

<!-- FORM -->
<div class="page-wrapper">
  <div class="premium-card">

    <h3 class="page-title">
      <i class="bi bi-person-plus me-2"></i> Create Employee
    </h3>

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label fw-medium">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium">Email</label>
        <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-medium">Select Role</label>
        <select name="group" class="form-select">
          <option value="Accountant">Accountant</option>
          <option value="Staff">Staff</option>
        </select>
      </div>

      <button type="submit" class="btn-save">
        <i class="bi bi-check-circle me-2"></i> Create Employee
      </button>

    </form>

  </div>
</div>

{% endblock %}

{% block js %}{% endblock %}
