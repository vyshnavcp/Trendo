{% extends 'main.html' %}
{% block title %}Add Coupon{% endblock %}
{% load static %}

{% block css %}
<style>
.page-wrapper {
    min-height: calc(100vh - 120px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.premium-card {
    background: #fff;
    border: none;
    border-radius: 22px;
    padding: 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 25px 60px rgba(0,0,0,.08);
    transition: .3s;
}

.premium-card:hover {
    transform: translateY(-4px);
}

.page-title {
    font-weight: 700;
    text-align: center;
    margin-bottom: 25px;
}

.form-control {
    border-radius: 12px;
    padding: 12px;
    border: 1px solid #e2e2e2;
}

.form-control:focus {
    border-color: #000;
    box-shadow: none;
}

.btn-save {
    background: linear-gradient(45deg, #000, #333);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 13px;
    font-weight: 600;
    width: 100%;
    transition: .3s;
}

.btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,.3);
    color: #fff;
}
</style>
{% endblock %}

{% block content %}

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <h4>Coupons</h4>
    <p>Manage your discount coupons</p>
  </div>
  <div class="topbar-right">
    <a href="{% url 'coupon_list' %}" class="btn-edit" style="width:auto;padding:0 14px;gap:6px;font-size:.82rem;font-weight:600;text-decoration:none;">
      <i class="bi bi-list-ul"></i> View All
    </a>
  </div>
</div>

<!-- FORM -->
<div class="page-wrapper">
  <div class="premium-card">

    <h3 class="page-title">
      <i class="bi bi-ticket-perforated me-2"></i> Add Coupon
    </h3>

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label fw-medium">Coupon Code</label>
        <input name="code" class="form-control" placeholder="Enter coupon code" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium">Discount (%)</label>
        <input name="discount" type="number" class="form-control" placeholder="Enter discount percentage" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium">Minimum Cart Value</label>
        <input name="min_cart" type="number" class="form-control" placeholder="Enter minimum cart value" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-medium">Expiry Date</label>
        <input type="date" name="expiry" class="form-control" required>
      </div>

      <button type="submit" class="btn-save">
        <i class="bi bi-check-circle me-2"></i> Save Coupon
      </button>

    </form>

  </div>
</div>

{% endblock %}

{% block js %}{% endblock %}
